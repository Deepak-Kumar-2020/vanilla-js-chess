<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/menu.js" defer></script>
    <script src="./js/state.js" defer></script>
    <script src="./js/render.js" defer></script>
    <script src="./js/moves.js" defer></script>
    <script src="./js/threats.js" defer></script>
    <script src="./js/controller.js" defer></script>
    <script src="./js/clock.js" defer></script>

    
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- The Start Menu -->
    <div class="setup-container" id="startMenu">
        <div class="header">
            <h1>Play Local Chess</h1>
            <p>Pass and play with a friend on this device</p>
        </div>

        <div class="section-title">Players</div>
        <div class="player-inputs">
            <div class="input-group">
                <input type="text" id="player1" aria-label="Player 1 Name" placeholder="Player 1 (White)" value="White">
            </div>
            <div class="input-group">
                <input type="text" id="player2" aria-label="Player 2 Name" placeholder="Player 2 (Black)" value="Black">
            </div>
        </div>

        <div class="section-title">Time Control</div>
        <div class="time-grid" id="timeGrid">
            <button class="time-btn" data-time="3">
                <div class="time-val">3 min</div>
                <div class="time-type">Blitz</div>
            </button>
            <button class="time-btn" data-time="5">
                <div class="time-val">5 min</div>
                <div class="time-type">Blitz</div>
            </button>
            <button class="time-btn active" data-time="10">
                <div class="time-val">10 min</div>
                <div class="time-type">Rapid</div>
            </button>
            <button class="time-btn" data-time="15">
                <div class="time-val">15 | 5</div>
                <div class="time-type">Rapid</div>
            </button>
            <button class="time-btn" data-time="30">
                <div class="time-val">30 min</div>
                <div class="time-type">Classical</div>
            </button>
            <button class="time-btn" data-time="unlimited">
                <div class="time-val">∞</div>
                <div class="time-type">Unlimited</div>
            </button>
        </div>

        <div class="flip-board-container">
            <label for="flipBoardCheck" class="flip-board-label">
                <input type="checkbox" id="flipBoardCheck" name="board_option" class="flip-board-checkbox"> 
                Flip board after every move
            </label>
        </div>

        <button class="start-btn" id="startBtn">Start Game</button>
    </div>
    
    <!-- The Game Area -->
    <div class="flex-container hidden" id="gameArea">
        <div class="player-info" id="black-info">
            <div id="black-clock"></div>
            <div id="black-name">Black</div>
        </div>
        <div class="chessboard">
            <div class="promo_menu">
                <div class="promo_box" id="q"></div>
                <div class="promo_box" id="r"></div>
                <div class="promo_box" id="b"></div>
                <div class="promo_box" id="n"></div>
            </div>
        </div>
        <div class="player-info play" id="white-info">
            <div id="white-clock"></div>
            <div id="white-name">White</div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="game-over-container hidden" id="gameOverScreen">
        <div class="winner-icon" id="winnerIcon">👑</div>
        <div class="header">
            <h1 class="game-over-title" id="gameOverTitle">Checkmate!</h1>
            <p class="game-over-subtitle" id="gameOverMessage">White wins the game.</p>
        </div>
        <button class="start-btn" id="newGameBtn">New Game</button>
    </div>
</body>
</html>
